name: config-check
services:
  junos-mcp:
    build: ./mcp/junos-mcp-server
    image: config-check/junos-mcp:local
    container_name: cc-junos-mcp
    restart: unless-stopped
    user: "1000:1000"
    command: ["python", "jmcp.py", "-f", "/app/config/devices.json", "-t", "streamable-http",
              "-H", "0.0.0.0", "-p", "30030", "--tokens-file", "/secrets/jmcp-tokens.json"]
    volumes:
      - ./config/devices.json:/app/config/devices.json:ro
      - ./secrets:/secrets:ro
      - ./mcp/policy/block.cfg:/app/block.cfg:ro
      - ./mcp/policy/block.cmd:/app/block.cmd:ro
    ports:
      - "127.0.0.1:30030:30030"

  backend:
    build: .
    image: config-check/backend:local
    container_name: cc-backend
    restart: unless-stopped
    user: "1000:1000"
    depends_on: [junos-mcp]
    environment:
      CC_ROOT: /opt/config-check
    volumes:
      - ./config:/opt/config-check/config:ro
      - ./knowledge:/opt/config-check/knowledge:ro
      - ./data:/opt/config-check/data
      - ./secrets/jmcp-backend.token:/secrets/jmcp-backend.token:ro
    ports:
      - "8080:8080"
