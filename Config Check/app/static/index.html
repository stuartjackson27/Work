<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Config Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: ops console — header bar, summary strip, role map left / findings right, evidence drawer */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --panel-2:#eef1f3; --line:#d9dfe3; --fg:#14202a; --muted:#5d6b76;
  --accent:#0f6e74; --accent-ink:#ffffff; --accent-soft:#dcefef;
  --sev5:#c22f2f; --sev4:#d9731a; --sev3:#b69212; --sev2:#3a78b8; --sev1:#7a8791; --ok:#2f8a57;
  --sev5-bg:#fbe5e3; --sev4-bg:#fcecdc; --sev3-bg:#f7f0d2; --sev2-bg:#e2edf8; --sev1-bg:#eceff1; --ok-bg:#e1f2e7;
  --code-bg:#0f1a22; --code-fg:#d8e3ea; --code-add:#7fd1a0; --code-del:#f19a95;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d151b; --panel:#141f27; --panel-2:#1a2730; --line:#26353f; --fg:#e3eaee; --muted:#93a3ae;
  --accent:#3fb3b5; --accent-ink:#06191b; --accent-soft:#163538;
  --sev5:#ff6b63; --sev4:#ff9d4a; --sev3:#e6c24a; --sev2:#6aa8e6; --sev1:#8e9ba5; --ok:#5cc489;
  --sev5-bg:#3a1a1a; --sev4-bg:#3a2614; --sev3-bg:#352e12; --sev2-bg:#15283a; --sev1-bg:#1f2a31; --ok-bg:#15301f;
  --code-bg:#091116; --code-fg:#d8e3ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d151b; --panel:#141f27; --panel-2:#1a2730; --line:#26353f; --fg:#e3eaee; --muted:#93a3ae;
  --accent:#3fb3b5; --accent-ink:#06191b; --accent-soft:#163538;
  --sev5:#ff6b63; --sev4:#ff9d4a; --sev3:#e6c24a; --sev2:#6aa8e6; --sev1:#8e9ba5; --ok:#5cc489;
  --sev5-bg:#3a1a1a; --sev4-bg:#3a2614; --sev3-bg:#352e12; --sev2-bg:#15283a; --sev1-bg:#1f2a31; --ok-bg:#15301f;
  --code-bg:#091116; --code-fg:#d8e3ea; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.num,td.mono,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.label{font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand .tag{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:4px}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;align-items:center;color:var(--muted);font-size:12px}
.meta b{color:var(--fg);font-weight:500;font-family:var(--f-mono)}
.run{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.run[disabled]{opacity:.7;cursor:progress}
.progress{height:3px;background:transparent;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* summary */
.summary{display:grid;grid-template-columns:minmax(220px,1.2fr) repeat(5,minmax(0,1fr)) minmax(200px,1.4fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-block:18px}
.summary > div{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.score{flex-direction:row!important;align-items:center;gap:14px!important}
.gauge{width:64px;height:64px;flex:none}
.score .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.score small{color:var(--muted);font-size:12px}
.sevcount .n{font-family:var(--f-mono);font-size:26px;font-weight:500;line-height:1.1}
.sevcount{border-top:3px solid var(--c)}
.trend svg{width:100%;height:46px;display:block}

/* main grid */
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;padding-bottom:40px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel > .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel > .hd h2{font-size:15px;font-weight:600}

/* role map */
.roles{padding:6px 14px 14px;display:flex;flex-direction:column;gap:14px}
.role h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;margin:8px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:5px;padding:7px 9px}
.tile:hover{border-color:var(--accent)}
.tile.on{outline:2px solid var(--accent);outline-offset:-1px}
.tile .h{font-family:var(--f-mono);font-size:13px;font-weight:500}
.tile .m{font-size:11px;color:var(--muted)}
.tile .dots{display:flex;gap:3px;margin-top:3px;min-height:7px}
.tile .dots span{width:7px;height:7px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:0 14px 14px;font-size:11px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:-1px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.filters input,.filters select{font:inherit;font-size:13px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
.filters input{flex:1 1 180px;min-width:0}
.sep{width:1px;height:20px;background:var(--line)}

/* table */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-family:var(--f-display);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel-2)}
tbody tr.sel{background:var(--accent-soft)}
tbody tr.accepted td{opacity:.5}
.sev{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:500;padding:2px 8px 2px 4px;border-radius:4px;background:var(--b);color:var(--c);white-space:nowrap}
.sev i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;background:var(--c);color:var(--panel);font-size:11px}
.title{font-weight:500}
.path{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
.src{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.src.llm{border-color:var(--accent);color:var(--accent)}
.conf{display:inline-block;width:46px;height:5px;background:var(--panel-2);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.conf b{display:block;height:100%;background:var(--accent)}
.state{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.state.new{color:var(--sev4)} .state.recurring{color:var(--muted)} .state.accepted{color:var(--ok)}
.empty{padding:28px 14px;color:var(--muted);text-align:center}

/* drawer */
.detail{border-top:1px solid var(--line);padding:16px 14px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.detail .full{grid-column:1/-1}
.detail h3{font-size:18px;font-weight:600}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted)}
.kv b{color:var(--fg);font-weight:500;font-family:var(--f-mono)}
pre{margin:6px 0 0;background:var(--code-bg);color:var(--code-fg);font-family:var(--f-mono);font-size:12px;line-height:1.55;padding:10px 12px;border-radius:6px;overflow-x:auto}
pre .add{color:var(--code-add)} pre .del{color:var(--code-del)} pre .cm{color:#7f8f9a}
.reason{max-width:72ch;margin:6px 0 0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 12px;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13px;z-index:20}

@media (max-width:1180px){.summary{grid-template-columns:repeat(3,minmax(0,1fr))}.summary .score,.summary .trend{grid-column:span 3}}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:620px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.summary .score,.summary .trend{grid-column:span 2}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:minmax(0,1fr)}.meta{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.state.regressed{color:var(--sev5)}
[hidden]{display:none!important}
.practice{border-left:3px solid var(--ok);background:var(--panel-2);padding:10px 12px;border-radius:0 8px 8px 0;margin:0}
.practice b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.chg{margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:9px 14px;font-family:var(--f-display);font-size:15px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--fg)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;flex:none}
@media (max-width:560px){.tabs button{padding:8px 8px;font-size:14px;gap:5px}.tabs .risk{display:none}}
.tabs .cnt{font-family:var(--f-mono);font-size:11px;font-weight:500;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.tabs .risk{font-size:11px;padding:1px 6px 1px 3px}
.tabs .risk i{width:15px;height:15px;font-size:10px}
.chg .hd .opt{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:auto;margin-right:12px;cursor:pointer}
.chg .list{display:flex;flex-direction:column}
.crow{border-top:1px solid var(--line);padding:10px 14px;display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.crow:first-child{border-top:0}
.crow .dev{font-family:var(--f-mono);font-weight:500}
.crow .dev small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
.crow .what{min-width:0}
.crow .what .sum{max-width:80ch}
.crow .meta2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:4px}
.crow .meta2 b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.crow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.delta{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.delta .p{color:var(--ok)} .delta .m{color:var(--sev5)}
.risk{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:500;padding:2px 8px 2px 4px;border-radius:4px;background:var(--b);color:var(--c);white-space:nowrap}
.risk i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:3px;background:var(--c);color:var(--panel);font-size:11px}
.crow .quiet{color:var(--muted);font-size:13px}
.cdetail{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:6px}
.cdetail ul{margin:6px 0 0;padding-left:18px}
.cdetail li{margin-bottom:6px}
.cdetail .ref{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.pill{font-size:11px;font-family:var(--f-mono);border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 7px;white-space:nowrap}
.btn.sm{padding:3px 9px;font-size:12px}
@media (max-width:760px){.crow{grid-template-columns:minmax(0,1fr)}.crow .acts{justify-content:flex-start}.cdetail{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<style>
.banner{margin-top:14px;padding:9px 12px;border-radius:6px;font-size:13px;background:var(--sev4-bg);color:var(--fg);border:1px solid var(--sev4)}
.tile.down{border-left-color:var(--muted);opacity:.65}
.tile .err{font-size:11px;color:var(--sev5)}
pre .ctx{color:#9fb0bb}
.scanpick{font:inherit;font-size:12px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.stats{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding:8px 14px 12px;border-top:1px solid var(--line)}
.note{width:100%;font:inherit;font-size:13px;background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
</style>
<header>
  <div class="wrap bar">
    <div class="brand"><h1>Config Check</h1><span class="tag" id="envTag">lab</span></div>
    <div class="meta">
      <span>Scan <select class="scanpick" id="scanPick" aria-label="Choose scan"></select></span>
      <span>Finished <b id="lastRun">–</b></span>
      <span>Model <b id="model">–</b></span>
      <span>Templates <b id="tpl">–</b></span>
      <button class="run" id="runBtn" type="button">▶ Run scan</button>
    </div>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>

<div class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section class="summary" aria-label="Scan summary">
    <div class="score">
      <svg class="gauge" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--panel-2)" stroke-width="8"/><circle id="gArc" cx="32" cy="32" r="26" fill="none" stroke="var(--sev4)" stroke-width="8" stroke-linecap="round" transform="rotate(-90 32 32)" stroke-dasharray="0 999"/></svg>
      <div><div class="label" id="scoreLbl">Compliance score</div><div class="big num" id="score">–</div><small id="scoreSub"></small></div>
    </div>
    <div class="sevcount" style="--c:var(--sev5)"><span class="label">Critical · 5</span><span class="n" id="c5">0</span></div>
    <div class="sevcount" style="--c:var(--sev4)"><span class="label">High · 4</span><span class="n" id="c4">0</span></div>
    <div class="sevcount" style="--c:var(--sev3)"><span class="label">Medium · 3</span><span class="n" id="c3">0</span></div>
    <div class="sevcount" style="--c:var(--sev2)"><span class="label">Low · 2</span><span class="n" id="c2">0</span></div>
    <div class="sevcount" style="--c:var(--sev1)"><span class="label">Info · 1</span><span class="n" id="c1">0</span></div>
    <div class="trend"><span class="label" id="trendLbl">Open findings · recent scans</span><svg id="spark" viewBox="0 0 240 46" preserveAspectRatio="none" aria-label="Findings trend"></svg></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tabF" aria-controls="viewF" data-tab="findings">Anomalies <span class="cnt" id="tabFCount">–</span></button>
    <button type="button" role="tab" id="tabS" aria-controls="viewF" data-tab="security">Security <span class="cnt" id="tabSCount">–</span><span id="tabSRisk"></span></button>
    <button type="button" role="tab" id="tabC" aria-controls="viewC" data-tab="changes">Config changes <span class="cnt" id="tabCCount">–</span><span id="tabCRisk"></span></button>
  </nav>

  <main id="viewF" role="tabpanel" aria-labelledby="tabF">
    <section class="panel" aria-labelledby="mapH">
      <div class="hd"><h2 id="mapH">Fleet by role</h2><span class="label" id="devCount"></span></div>
      <div class="roles" id="roles"></div>
      <div class="legend">
        <span style="--c:var(--sev5)">Critical</span><span style="--c:var(--sev4)">High</span><span style="--c:var(--sev3)">Medium</span><span style="--c:var(--sev2)">Low</span><span style="--c:var(--ok)">Clean</span><span style="--c:var(--muted)">Unreachable</span>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="panel" aria-labelledby="fH">
      <div class="hd"><h2 id="fH">Anomalies</h2><span class="label" id="fCount"></span></div>
      <div class="filters">
        <button class="chip" type="button" data-f="sev" data-v="5" aria-pressed="false">Critical</button>
        <button class="chip" type="button" data-f="sev" data-v="4" aria-pressed="false">High</button>
        <button class="chip" type="button" data-f="sev" data-v="3" aria-pressed="false">Medium</button>
        <button class="chip" type="button" data-f="sev" data-v="2" aria-pressed="false">Low</button>
        <span class="sep"></span>
        <button class="chip" type="button" data-f="src" data-v="Rule" aria-pressed="false">Rule</button>
        <button class="chip" type="button" data-f="src" data-v="LLM" aria-pressed="false">LLM</button>
        <span class="sep"></span>
        <select id="cat" aria-label="Category"><option value="">All categories</option><option>Base</option><option>Infra</option><option>Service</option><option>Drift</option></select>
        <input id="q" type="search" placeholder="Filter by device, path, text…" aria-label="Search findings">
      </div>
      <div class="tbl">
        <table>
          <thead><tr><th>Severity</th><th>Device</th><th>Finding</th><th id="catH">Category</th><th>Source</th><th>Confidence</th><th>State</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="detail"></div>
    </section>
  </main>

  <div id="viewC" role="tabpanel" aria-labelledby="tabC" hidden>
    <section class="panel chg" aria-labelledby="cH">
      <div class="hd"><h2 id="cH">Config changes</h2><label class="opt"><input type="checkbox" id="hideUnchanged" checked> Hide unchanged devices</label><span class="label" id="cCount"></span></div>
      <div class="list" id="changes"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const SEV={5:"Critical",4:"High",3:"Medium",2:"Low",1:"Info"};
const sevVar=s=>s?`var(--sev${s})`:"var(--ok)";
let S=null; // API state
const st={sev:new Set(),src:new Set(),cat:"",q:"",dev:"",sel:null,scan:null,view:"findings"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SECV=()=>st.view==="security";
const inDom=(f,sec)=>(f.category==="Security")===sec;
const F=()=>S?S.findings.filter(f=>inDom(f,SECV())):[];
const openIn=sec=>S?S.findings.filter(f=>inDom(f,sec)&&f.state!=="accepted"):[];
const open=()=>F().filter(f=>f.state!=="accepted");
const worst=h=>Math.max(0,...open().filter(f=>f.device===h).map(f=>f.severity));
const devInfo=h=>(S.devices.find(d=>d.device===h)||{});
const fmtTime=t=>{if(!t)return"–";const d=new Date(t);return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short"})+" "+d.toTimeString().slice(0,5)};

async function api(path,opts){
  const r=await fetch(path,opts);
  if(!r.ok){let m=r.statusText;try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
  return r.json();
}
async function load(){
  try{S=await api("/api/state"+(st.scan?`?scan=${st.scan}`:""))}
  catch(e){banner(`Could not load data from the backend: ${e.message}`);return}
  render();
  if(S.progress&&S.progress.running) poll();
}
function banner(msg){const b=$("banner");b.textContent=msg||"";b.hidden=!msg}

function header(){
  const sc=S.scan;
  $("lastRun").textContent=sc?fmtTime(sc.finished):"never";
  $("model").textContent=sc?sc.model:(S.llm.model||"–");
  $("tpl").textContent=sc?sc.templates:"–";
  $("scanPick").innerHTML=(S.scans||[]).filter(s=>s.status!=="running").map(s=>
    `<option value="${s.id}" ${sc&&s.id===sc.id?"selected":""}>#${s.id} · ${fmtTime(s.started)} · ${s.status}</option>`).join("")||`<option>no scans yet</option>`;
  if(sc&&sc.status==="partial") banner("Last scan finished with warnings: "+sc.error);
  else if(sc&&sc.status==="failed") banner("Last scan failed: "+sc.error);
  else banner("");
}
function summary(){
  const o=open();
  for(let s=1;s<=5;s++) $("c"+s).textContent=o.filter(f=>f.severity===s).length;
  const devs=S.devices.filter(d=>d.status==="ok");
  const w=S.weights; const pen=o.reduce((a,f)=>a+(w[f.severity]||0),0);
  const score=S.scan&&devs.length?Math.max(0,Math.round(100-pen/devs.length)):null;
  $("score").textContent=score??"–";
  $("scoreSub").textContent=S.scan?`${devs.filter(d=>!worst(d.device)).length} of ${S.devices.length} devices clean`:"Run a scan to get a score";
  const C=2*Math.PI*26; $("gArc").setAttribute("stroke-dasharray",`${C*(score||0)/100} ${C}`);
  $("gArc").setAttribute("stroke",score>=80?"var(--ok)":score>=60?"var(--sev3)":"var(--sev4)");
  $("scoreLbl").textContent=SECV()?"Security score":"Compliance score";
  $("trendLbl").textContent=(SECV()?"Open security findings":"Open findings")+" · recent scans";
  const t=(S.trend||[]).map(x=>SECV()?(x.security??0):x.open);
  const W=240,H=46,p=4;
  if(t.length<2){$("spark").innerHTML=`<text x="0" y="28" fill="var(--muted)" font-size="11">Needs two or more scans</text>`;return}
  const max=Math.max(...t)+2, xs=i=>p+i*(W-2*p)/(t.length-1), ys=v=>H-p-v/max*(H-2*p);
  const line=t.map((v,i)=>`${i?"L":"M"}${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join("");
  $("spark").innerHTML=`<path d="${line}L${xs(t.length-1)},${H}L${xs(0)},${H}Z" fill="var(--accent-soft)"/>
   <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
   <circle cx="${xs(t.length-1)}" cy="${ys(t[t.length-1])}" r="3.2" fill="var(--accent)"/>`;
}
function roles(){
  $("devCount").textContent=S.inventory.length+" devices";
  $("roles").innerHTML=Object.entries(S.roles).map(([r,info])=>{
    const ds=S.inventory.filter(d=>d.role===r);
    const n=open().filter(f=>f.role===r).length;
    return `<div class="role"><h3><span title="${esc(info.description)}">${esc(r)}</span><span class="num">${n} open</span></h3><div class="tiles">${
      ds.map(d=>{const di=devInfo(d.name);const down=S.scan&&di.status!=="ok";const w=worst(d.name);
        const fs=open().filter(f=>f.device===d.name).sort((a,b)=>b.severity-a.severity);
        return `<button type="button" class="tile${st.dev===d.name?" on":""}${down?" down":""}" style="--c:${sevVar(w)}" data-dev="${d.name}" aria-pressed="${st.dev===d.name}">
          <span class="h">${esc(d.name)}</span><span class="m">${esc(d.host)} · ${esc(di.version||d.model)}</span>
          ${down?`<span class="err">${esc(di.status||"not scanned")}</span>`:`<span class="dots">${fs.map(f=>`<span style="--c:${sevVar(f.severity)}" title="${SEV[f.severity]}"></span>`).join("")}</span>`}</button>`}).join("")
    }</div></div>`}).join("");
  const sx=S.scan&&S.scan.stats; let txt="";
  if(sx){const l=(SECV()?sx.llm_security:sx.llm)||{};const devs=Object.entries(l).filter(([k])=>k!=="error");
    const kept=devs.reduce((a,[,v])=>a+(v.kept||0),0), unv=devs.reduce((a,[,v])=>a+(v.dropped_unverified||0),0),
      dup=devs.reduce((a,[,v])=>a+(v.dropped_duplicate||0),0), secs=devs.reduce((a,[,v])=>a+(v.seconds||0),0);
    txt=`${SECV()?"security review · ":""}rules ${F().filter(f=>f.source==="Rule").length} · llm kept ${kept}, dropped ${unv} unverified / ${dup} duplicate · llm ${Math.round(secs)}s`;
    if(l.error) txt+=` · llm error`;}
  $("stats").textContent=txt;
}
function filtered(){
  const q=st.q.toLowerCase();
  return F().filter(f=>(!st.sev.size||st.sev.has(String(f.severity)))&&(!st.src.size||st.src.has(f.source))&&(!st.cat||f.category===st.cat)&&(!st.dev||f.device===st.dev)
    &&(!q||[f.device,f.title,f.path,f.reason].join(" ").toLowerCase().includes(q))).sort((a,b)=>(a.state==="accepted")-(b.state==="accepted")||b.severity-a.severity);
}
function rows(){
  const list=filtered();
  $("fCount").textContent=`${list.length} shown${st.dev?" · "+st.dev:""}`;
  tabCounts();
  $("fH").textContent=SECV()?"Security findings":"Anomalies";
  $("catH").textContent=SECV()?"Baseline":"Category";
  $("cat").hidden=SECV();
  if(!S.scan){$("rows").innerHTML=`<tr><td colspan="7" class="empty">No scans yet. Press <b>Run scan</b> to collect configs from ${S.inventory.length} devices and check them.</td></tr>`;$("detail").innerHTML="";return}
  $("rows").innerHTML=list.length?list.map(f=>`<tr tabindex="0" data-id="${f.id}" class="${st.sel===f.id?"sel":""} ${f.state==="accepted"?"accepted":""}">
    <td><span class="sev" style="--c:var(--sev${f.severity});--b:var(--sev${f.severity}-bg)"><i>${f.severity}</i>${SEV[f.severity]}</span></td>
    <td class="mono">${esc(f.device)}</td>
    <td><div class="title">${esc(f.title)}</div><div class="path">${esc(f.path)}</div></td>
    <td>${SECV()?`<span class="mono">${esc((f.doc.match(/§[\d.]+/)||[f.doc||"–"])[0])}</span>`:esc(f.category)}</td>
    <td><span class="src ${f.source==="LLM"?"llm":""}">${f.source}</span></td>
    <td class="mono"><span class="conf"><b style="width:${f.confidence*100}%"></b></span>${f.source==="Rule"?"exact":Math.round(f.confidence*100)+"%"}</td>
    <td><span class="state ${f.state}">${f.state}</span></td></tr>`).join("")
    :`<tr><td colspan="7" class="empty">No ${SECV()?"security findings":"anomalies"} match these filters.</td></tr>`;
  detail();
}
function evLine(s){
  if(s.startsWith("MISSING: ")) return `<span class="del">- ${esc(s.slice(9))}</span>`;
  if(s.startsWith("CONFLICT: ")) return `<span class="del">! ${esc(s.slice(10))}</span>`;
  return `<span class="ctx">  ${esc(s)}</span>`;
}
function detail(){
  const f=F().find(x=>x.id===st.sel);
  if(!f){$("detail").innerHTML=`<div class="empty">${SECV()?"Select a finding to see the best practice, the current gap and the suggested fix.":"Select a finding to see evidence, the design reference and the suggested fix."}</div>`;return}
  $("detail").innerHTML=`<div class="detail">
    <div class="full"><span class="sev" style="--c:var(--sev${f.severity});--b:var(--sev${f.severity}-bg)"><i>${f.severity}</i>${SEV[f.severity]}</span>
      <h3 style="margin-top:8px">${esc(f.title)}</h3>
      <div class="kv" style="margin-top:6px"><span>Device <b>${esc(f.device)}</b></span><span>Role <b>${esc(f.role)}</b></span><span>Hierarchy <b>${esc(f.path)}</b></span><span>Detected by <b>${f.source==="LLM"?"LLM · "+esc(S.scan.model):"Rule engine"}</b></span>${f.rule_id?`<span>Rule <b>${esc(f.rule_id)}</b></span>`:""}</div>
      <p class="reason">${esc(f.reason)}</p>
      ${f.practice?`<p class="practice"><b>Best practice</b>${esc(f.practice)}</p>`:""}
      <div class="kv"><span>Reference <b>${esc(f.doc||"–")}</b></span></div></div>
    <div><span class="label">${SECV()?"Current gap":"Evidence"} · ! present but wrong · - missing</span><pre>${f.evidence.map(evLine).join("\n")||"(none)"}</pre></div>
    <div><span class="label">Suggested fix</span><pre>${f.fix.map(s=>`<span class="add">+ ${esc(s)}</span>`).join("\n")||"(review manually)"}</pre></div>
    <div class="full"><input class="note" id="note" placeholder="Note for this decision (optional)" value="${esc(f.note)}"></div>
    <div class="full actions">
      <button class="btn pri" type="button" data-act="copy" ${f.fix.length?"":"disabled"}>Copy fix</button>
      <button class="btn" type="button" data-act="accept">${f.state==="accepted"?"Reopen":"Accept as exception"}</button>
      <button class="btn" type="button" data-act="close">Close</button></div></div>`;
}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2600)}

const RISK={5:"Critical",4:"High",3:"Review",2:"Low",1:"Cosmetic"};
const openChg=new Set();
function changesPanel(){
  const box=$("changes");
  if(!S.scan){box.innerHTML=`<div class="empty">Changes appear after the second scan.</div>`;$("cCount").textContent="";return}
  const ch=S.changes||[]; let n=0, hidden=0; const hideU=$("hideUnchanged").checked;
  box.innerHTML=S.inventory.map(d=>{
    const di=devInfo(d.name); const bl=(S.baselines||{})[d.name];
    const mine=ch.filter(c=>c.device===d.name);
    const pinBtn=bl&&bl.scan_id===S.scan.id
      ?`<button class="btn sm" type="button" data-unpin="${d.name}">Unpin baseline</button>`
      :`<button class="btn sm" type="button" data-pin="${d.name}" ${di.status!=="ok"?"disabled":""}>Pin this scan as baseline</button>`;
    const blTxt=bl?`<span class="pill" title="Pinned ${esc(bl.pinned)}">baseline #${bl.scan_id}</span>`:"";
    const quiet=di.status!=="ok"||!mine.length;
    if(quiet&&hideU){hidden++;return ""}
    if(di.status!=="ok") return `<div class="crow"><div class="dev">${esc(d.name)}</div><div class="what quiet">Not collected in this scan.</div><div class="acts">${blTxt}</div></div>`;
    const prev=mine.find(c=>c.kind==="previous"), base=mine.find(c=>c.kind==="baseline");
    const regs=open().filter(f=>f.device===d.name&&f.state==="regressed");
    if(!prev&&!base){
      const lastC=((S.commits||{})[d.name]||[])[0];
      return `<div class="crow"><div class="dev">${esc(d.name)}</div><div class="what quiet">No changes since the previous scan${bl?" or the baseline":""}.${lastC?` Last commit ${esc(fmtTime(lastC.time))} by ${esc(lastC.user)}.`:""}</div><div class="acts">${blTxt}${pinBtn}</div></div>`;
    }
    n++;
    const rows=[prev,base].filter(Boolean).map(c=>changeRow(d.name,c,regs)).join("");
    return rows.replace('<div class="acts">',`<div class="acts">${blTxt}${pinBtn}`);
  }).join("");
  if(!n&&!box.innerHTML.trim()) box.innerHTML=`<div class="crow"><div class="what quiet" style="grid-column:1/-1">No device changed since the previous scan${hidden?` (${hidden} unchanged hidden)`:""}.</div></div>`;
  $("cCount").textContent=(n?`${n} device${n>1?"s":""} changed`:"no changes")+(hidden&&n?` · ${hidden} unchanged hidden`:"");
  const risks=ch.map(c=>(c.review&&c.review.risk)||Math.max(1,...(c.hints||[]).map(h=>h.risk)));
  const top=risks.length?Math.max(...risks):0;
  $("tabCCount").textContent=n;
  $("tabCRisk").innerHTML=top>=3?`<span class="risk" title="Highest change risk" style="--c:var(--sev${top});--b:var(--sev${top}-bg)"><i>${top}</i>${RISK[top]}</span>`:"";
}
const TABS={findings:"tabF",security:"tabS",changes:"tabC"}, ORDER=Object.keys(TABS);
function tabCounts(){
  if(!S) return;
  $("tabFCount").textContent=openIn(false).length;
  const so=openIn(true); $("tabSCount").textContent=so.length;
  const top=Math.max(0,...so.map(f=>f.severity));
  $("tabSRisk").innerHTML=top>=4?`<span class="risk" title="Worst open security finding" style="--c:var(--sev${top});--b:var(--sev${top}-bg)"><i>${top}</i>${SEV[top]}</span>`:"";
}
function showTab(t,save){
  if(!TABS[t]) t="findings";
  const changed=st.view!==t; st.view=t;
  $("viewF").hidden=t==="changes"; $("viewC").hidden=t!=="changes";
  for(const [k,id] of Object.entries(TABS)){$(id).setAttribute("aria-selected",k===t);$(id).tabIndex=k===t?0:-1}
  if(save){try{localStorage.setItem("cc.tab",t)}catch(e){} history.replaceState(null,"",t==="findings"?location.pathname+location.search:"#"+t)}
  if(changed&&S){st.sel=null;st.cat="";$("cat").value="";if(t!=="changes")render();}
}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab,true)});
document.querySelector(".tabs").addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){const i=ORDER.indexOf(st.view),t=ORDER[(i+(e.key==="ArrowRight"?1:ORDER.length-1))%ORDER.length];showTab(t,true);$(TABS[t]).focus()}});
$("hideUnchanged").addEventListener("change",()=>{try{localStorage.setItem("cc.hideUnchanged",$("hideUnchanged").checked?"1":"0")}catch(e){} changesPanel()});
(()=>{let t=({"#changes":"changes","#security":"security"})[location.hash]||"findings";
  try{if(!location.hash)t=localStorage.getItem("cc.tab")||t; const h=localStorage.getItem("cc.hideUnchanged"); if(h!==null)$("hideUnchanged").checked=h==="1"}catch(e){}
  showTab(t,false)})();
function changeRow(dev,c,regs){
  const key=`${dev}:${c.kind}`; const r=c.review||{}; const risk=r.risk||Math.max(1,...(c.hints||[]).map(h=>h.risk));
  const who=(c.commits||[]).map(x=>`${esc(x.user)} ${esc(fmtTime(x.time))}${x.comment?` “${esc(x.comment)}”`:""}`).join(", ");
  const label=c.kind==="previous"?`since scan #${c.base_scan_id}`:`vs baseline #${c.base_scan_id}`;
  const sum=r.summary?esc(r.summary):(c.kind==="baseline"?"Drift from the pinned baseline.":(r.error?`LLM review failed: ${esc(r.error)}`:"Not reviewed by the LLM."));
  const isOpen=openChg.has(key);
  const diff=[...c.added.map(l=>`<span class="add">+ ${esc(l)}</span>`),...c.removed.map(l=>`<span class="del">- ${esc(l)}</span>`)].join("\n");
  const concerns=[...(c.hints||[]).map(h=>({t:h.reason,s:h.risk,ref:"rule",lines:h.lines})),...((r.concerns)||[]).map(x=>({t:x.text,s:x.severity,ref:"LLM · "+x.ref,lines:x.lines}))];
  return `<div class="crow">
    <div class="dev">${esc(dev)}<small>${label}</small></div>
    <div class="what">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="risk" style="--c:var(--sev${risk});--b:var(--sev${risk}-bg)"><i>${risk}</i>${RISK[risk]}</span>
        <span class="delta"><span class="p">+${c.added.length}</span> / <span class="m">−${c.removed.length}</span></span>
        ${r.intent?`<span class="quiet">${esc(r.intent)}</span>`:""}</div>
      <div class="sum" style="margin-top:6px">${sum}</div>
      <div class="meta2"><span>Sections <b>${esc(Object.keys(c.sections||{}).join(", "))}</b></span>${who?`<span>Commits <b>${who}</b></span>`:(c.kind==="previous"?`<span>Commits <b>none recorded in window</b></span>`:"")}${regs.length&&c.kind==="previous"?`<span>Regressed findings <b style="color:var(--sev5)">${regs.length}</b></span>`:""}</div>
    </div>
    <div class="acts"><button class="btn sm" type="button" data-toggle="${key}" aria-expanded="${isOpen}">${isOpen?"Hide diff":"Show diff"}</button></div>
    ${isOpen?`<div class="cdetail"><div><span class="label">Diff</span><pre>${diff}</pre></div>
      <div><span class="label">Concerns</span>${concerns.length?`<ul>${concerns.map(x=>`<li><span class="risk" style="--c:var(--sev${x.s});--b:var(--sev${x.s}-bg)"><i>${x.s}</i>${RISK[x.s]}</span> ${esc(x.t)}<span class="ref">${esc(x.ref)} · ${esc(x.lines.join(" | "))}</span></li>`).join("")}</ul>`:`<p class="quiet">None found.</p>`}
      ${regs.length&&c.kind==="previous"?`<span class="label">Regressed findings</span><ul>${regs.map(f=>`<li>${esc(f.title)}</li>`).join("")}</ul>`:""}</div></div>`:""}
  </div>`;
}
$("changes").addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.dataset.toggle){const k=t.dataset.toggle; openChg.has(k)?openChg.delete(k):openChg.add(k); changesPanel(); return}
  const dev=t.dataset.pin||t.dataset.unpin; if(!dev)return;
  try{await api(`/api/baseline/${dev}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({scan_id:t.dataset.pin?S.scan.id:null})});
    toast(t.dataset.pin?`Scan #${S.scan.id} pinned as ${dev} baseline. Future scans show drift from it.`:`Baseline unpinned for ${dev}`); load();}
  catch(err){toast("Could not save: "+err.message)}
});
function render(){header();summary();changesPanel();roles();rows()}

let polling=false;
async function poll(){
  if(polling)return; polling=true;
  const b=$("runBtn"),p=$("prog"); b.disabled=true;
  try{
    for(;;){
      const pr=await api("/api/progress");
      p.style.width=(pr.pct||0)+"%"; b.textContent=(pr.message||"Scanning")+"…";
      if(!pr.running){toast(pr.message||"Scan finished");st.scan=null;break}
      await new Promise(r=>setTimeout(r,1500));
    }
  }catch(e){toast("Lost contact with backend: "+e.message)}
  b.disabled=false;b.textContent="▶ Run scan";p.style.width="0";polling=false;load();
}

document.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>{
  const set=st[b.dataset.f],v=b.dataset.v; set.has(v)?set.delete(v):set.add(v);
  b.setAttribute("aria-pressed",set.has(v)); rows();}));
$("cat").addEventListener("change",e=>{st.cat=e.target.value;rows()});
$("q").addEventListener("input",e=>{st.q=e.target.value;rows()});
$("scanPick").addEventListener("change",e=>{st.scan=+e.target.value||null;st.sel=null;load()});
$("roles").addEventListener("click",e=>{const t=e.target.closest(".tile");if(!t)return;st.dev=st.dev===t.dataset.dev?"":t.dataset.dev;roles();rows()});
const pick=e=>{const tr=e.target.closest("tr[data-id]");if(!tr)return;const id=+tr.dataset.id;st.sel=st.sel===id?null:id;rows();
  if(st.sel) $("detail").scrollIntoView({block:"nearest",behavior:"smooth"})};
$("rows").addEventListener("click",pick);
$("rows").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(e)}});
$("detail").addEventListener("click",async e=>{
  const a=e.target.dataset.act; const f=F().find(x=>x.id===st.sel); if(!a||!f)return;
  if(a==="close"){st.sel=null;rows()}
  if(a==="accept"){const next=f.state==="accepted"?"open":"accepted";
    try{await api(`/api/findings/${f.fingerprint}/state`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:next,note:$("note").value})});
      toast(next==="accepted"?"Accepted as exception. It stays accepted in future scans.":"Finding reopened");
      const keep=st.sel; await load(); st.sel=keep; rows();}catch(err){toast("Could not save: "+err.message)}}
  if(a==="copy"){const txt=f.fix.join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Fix copied"),()=>{const r=document.createRange();r.selectNodeContents(e.target.closest(".detail").querySelectorAll("pre")[1]);getSelection().removeAllRanges();getSelection().addRange(r);toast("Fix selected. Press Ctrl+C")})}
});
$("runBtn").addEventListener("click",async()=>{
  try{await api("/api/scan",{method:"POST"});poll()}catch(e){toast(e.message)}
});
load();
</script>

</body>
</html>
